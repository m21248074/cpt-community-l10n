name: Compile CPT Languages

on:
  push:
    branches: [main]
    paths:
      - '**/*.ts'
  pull_request:
    paths:
      - '**/*.ts'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Qt Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qttools5-dev-tools

      - name: Compile and Rename to PTL
        run: |
          mkdir -p publish
          # 尋找所有子目錄中的 .ts 檔案（template.ts 為原文範本，不編譯）
          find . -name "*.ts" ! -name "template.ts" | while read -r file; do
            base=$(basename "$file" .ts)
            lrelease "$file" -qm "publish/${base}.ptl"
          done

      - name: Upload PTL Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Packet-Tracer-Languages
          path: publish/*.ptl

      - name: Publish Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: publish/*.ptl
